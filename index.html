<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculadora">
        <h1>Calculadora</h1>

        <input type="number" id="num1" placeholder="Primer número">
        <input type="number" id="num2" placeholder="Segundo número">

        <div class="botones">
            <button onclick="calcular('suma')">Sumar</button>
            <button onclick="calcular('resta')">Restar</button>
            <button onclick="calcular('multiplicacion')">Multiplicar</button>
            <button onclick="calcular('potencia')">Potencia</button>
        </div>

        <h2>Resultado:</h2>
        <p id="resultado">0</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
